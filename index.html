<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>電視節目表 — TV Guide</title>
<style>
/* ===== TV Guide — modern redesign (per design doc) ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #4F5BD5; --radius: 16px;
  --bg: #F4F5FA; --surface: #FFFFFF; --ink-1: #1B1E28; --ink-2: #6A7080;
  --line: #E7E9F1; --logo-mono: #EEF0F6;
}
html, body { height: 100%; }
body {
  font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--ink-1);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
.tvg-root { position: fixed; inset: 0; background: var(--bg); color: var(--ink-1);
  display: flex; flex-direction: column; overflow: hidden; }

/* ===== App bar ===== */
.appbar { flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-left { display: flex; align-items: center; gap: 14px; }
.appbar-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent); color: #fff; box-shadow: 0 6px 16px -6px var(--accent); }
.appbar-flag { font-size: 30px; line-height: 1; }
.appbar-title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.appbar-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; font-weight: 500; }
.appbar-right { text-align: right; }
.clock { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.datelabel { font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin-top: 1px; }
.backbtn { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--bg); color: var(--ink-1); transition: background .15s, transform .15s; }
.backbtn:hover { background: var(--line); transform: translateX(-2px); }

/* ===== Region select ===== */
.rs-root { display: flex; flex-direction: column; height: 100%; }
.rs-main { flex: 1; overflow-y: auto; padding: 36px clamp(28px, 6vw, 90px) 60px; }
.rs-sectionhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
.rs-eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.04em; color: var(--ink-1); }
.rs-hint { font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.rs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
@media (max-width: 1100px) { .rs-grid { grid-template-columns: repeat(2, 1fr); } }
.rs-card { position: relative; text-align: left; display: flex; align-items: center; gap: 18px;
  padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s; }
.rs-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -22px rgba(20,24,50,.45);
  border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); }
.rs-flagtile { flex: none; width: 64px; height: 64px; border-radius: 16px; display: grid;
  place-items: center; font-size: 36px; line-height: 1; background: var(--bg); transition: background .18s; }
.rs-card:hover .rs-flagtile { background: color-mix(in oklab, var(--accent) 12%, var(--bg)); }
.rs-cardbody { display: flex; flex-direction: column; gap: 7px; flex: 1; }
.rs-name { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.rs-count { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--bg);
  align-self: flex-start; white-space: nowrap; padding: 3px 10px; border-radius: 999px; }
.rs-go { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent);
  opacity: 0; transform: translateX(-6px); transition: opacity .18s, transform .18s; }
.rs-card:hover .rs-go { opacity: 1; transform: translateX(0); }

/* ===== EPG ===== */
.epg { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.epg-filters { flex: none; display: flex; align-items: center; gap: 18px; padding: 14px 24px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; flex: 1; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; color: var(--ink-2); transition: all .15s;
  border: 1px solid transparent; white-space: nowrap; flex: none; background: var(--bg); }
.chip:hover { background: var(--line); }
.chip.is-active { background: var(--chip-accent, var(--accent)); color: #fff; }
.chip.is-active .chip-count { background: rgba(255,255,255,.25); color: #fff; }
.chip.is-active .chip-dot { background: rgba(255,255,255,.9); }
.chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chip-accent); flex: none; }
.chip-count { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--surface); color: var(--ink-2); }
.searchbox { flex: none; display: flex; align-items: center; gap: 8px; width: 280px; padding: 9px 14px;
  border-radius: 12px; background: var(--bg); color: var(--ink-2);
  border: 1px solid transparent; transition: border-color .15s, background .15s; }
.searchbox:focus-within { border-color: var(--accent); background: var(--surface); }
.searchbox input { border: none; outline: none; background: none; flex: 1; font-size: 14px; color: var(--ink-1); }
.searchbox input::placeholder { color: var(--ink-2); }
.search-clear { color: var(--ink-2); font-size: 18px; line-height: 1; padding: 0 2px; }

.epg-board { flex: 1; min-height: 0; overflow: auto; position: relative; }
.epg-inner { position: relative; width: calc(var(--rail-w) + var(--total-w)); min-height: 100%; }
.epg-axis { position: sticky; top: 0; z-index: 30; display: flex; height: 46px;
  background: color-mix(in oklab, var(--surface) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.axis-corner { position: sticky; left: 0; z-index: 31; flex: none; width: var(--rail-w); height: 100%;
  display: flex; align-items: center; gap: 8px; padding: 0 18px; background: var(--surface);
  border-right: 1px solid var(--line); }
.corner-label { font-size: 13px; font-weight: 800; }
.corner-count { font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--bg);
  padding: 1px 8px; border-radius: 999px; }
.axis-track { position: relative; flex: 1; }
.tick { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 10px; }
.tick::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.tick-hour span { font-size: 13.5px; font-weight: 800; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.tick-half span { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.epg-rows { position: relative; }
.epg-row { display: flex; height: var(--row-h); border-bottom: 1px solid var(--line); }
.epg-row.hidden { display: none; }
.epg-row:nth-child(even) .epg-track { background: color-mix(in oklab, var(--ink-1) 1.6%, transparent); }
.epg-rail { position: sticky; left: 0; z-index: 20; flex: none; width: var(--rail-w); height: 100%;
  display: flex; align-items: center; gap: 11px; padding: 0 16px; background: var(--surface);
  border-right: 1px solid var(--line); overflow: hidden; }
.ch-logo { flex: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; letter-spacing: -0.02em; overflow: hidden; }
.ch-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.rail-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rail-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-meta { display: flex; align-items: center; gap: 8px; }
.rail-num { font-size: 11px; font-weight: 800; color: var(--ink-2); background: var(--bg);
  padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.rail-catbar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }

.epg-track { position: relative; flex: 1; height: 100%; }
.cell { position: absolute; top: 5px; bottom: 5px; display: flex; align-items: stretch; overflow: hidden;
  border-radius: 12px; text-align: left; padding: 0; transition: transform .12s, box-shadow .12s, filter .12s;
  background: color-mix(in oklab, var(--cell-accent) 9%, var(--surface)); }
.cell:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px rgba(20,24,50,.4); z-index: 5; }
.cell-main { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 7px 11px; min-width: 0; flex: 1; }
.cell-title { display: flex; align-items: center; gap: 5px; min-width: 0; }
.cell-titletext { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-time { font-size: 11px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cell.is-now { box-shadow: inset 0 0 0 2px var(--cell-accent);
  background: color-mix(in oklab, var(--cell-accent) 16%, var(--surface)); }
.cell.is-past { filter: grayscale(.5); opacity: .58; }
.cell.is-past:hover { opacity: .85; filter: none; }
.cell-nowtag { position: absolute; top: 5px; right: 5px; font-size: 8.5px; font-weight: 900; letter-spacing: .06em;
  background: var(--cell-accent); color: #fff; padding: 2px 5px; border-radius: 5px; }
.cell.is-tight .cell-time { display: none; }
.cell.is-tight .cell-main { padding: 4px 7px; }
.cell.is-tight .cell-nowtag { display: none; }
.epg-empty { padding: 60px; text-align: center; color: var(--ink-2); font-weight: 600; }

.now-line { position: absolute; top: 0; bottom: 0; width: 2px; z-index: 25; pointer-events: none; background: var(--accent); }
.now-bubble { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800;
  color: #fff; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--accent); }

/* ===== Program detail ===== */
.pd-scrim { position: fixed; inset: 0; z-index: 200; background: rgba(15,18,35,.42); backdrop-filter: blur(3px);
  display: flex; justify-content: flex-end; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.pd-panel { position: relative; width: 420px; max-width: 92vw; height: 100%; background: var(--surface);
  display: flex; flex-direction: column; box-shadow: -20px 0 50px -20px rgba(0,0,0,.4);
  animation: slidein .26s cubic-bezier(.2,.7,.3,1); }
@keyframes slidein { from { transform: translateX(40px); opacity: .4; } }
.pd-close { position: absolute; top: 16px; right: 16px; z-index: 3; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; color: var(--ink-1); background: color-mix(in oklab, var(--surface) 60%, transparent);
  backdrop-filter: blur(4px); transition: background .15s; }
.pd-close:hover { background: var(--bg); }
.pd-hero { padding: 30px 28px 22px; background: linear-gradient(160deg, color-mix(in oklab, var(--pd-accent) 16%, var(--surface)), var(--surface));
  border-bottom: 1px solid var(--line); }
.pd-chanrow { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.pd-logo { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 14px; font-weight: 800; overflow:hidden; }
.pd-logo img { width:100%; height:100%; object-fit:contain; background:#fff; }
.pd-chanmeta { display: flex; flex-direction: column; gap: 2px; }
.pd-channame { font-size: 15px; font-weight: 700; }
.pd-channum { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.pd-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; }
.pd-tags { display: flex; gap: 7px; margin-top: 14px; flex-wrap: wrap; }
.pd-tag { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--ink-2); }
.pd-tag.tag-live { background: var(--accent); color: #fff; }
.pd-body { flex: 1; overflow-y: auto; padding: 22px 28px; }
.pd-timecard { display: flex; align-items: center; justify-content: space-between; background: var(--bg);
  border-radius: 16px; padding: 16px 22px; margin-bottom: 24px; }
.pd-timeblock { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.pd-timebig { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pd-timelabel { font-size: 11px; color: var(--ink-2); font-weight: 600; }
.pd-timearrow { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.pd-section { margin-bottom: 24px; }
.pd-section h3 { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
.pd-section p { font-size: 14px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty; }
.pd-actions { flex: none; display: flex; gap: 10px; padding: 16px 28px; border-top: 1px solid var(--line); }
.pd-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px;
  border-radius: 13px; font-size: 14px; font-weight: 700; transition: all .15s; }
.pd-btn-ghost { background: var(--bg); color: var(--ink-1); }
.pd-btn-ghost:hover { background: var(--line); }
.pd-btn-ghost.is-on { color: #C28A1A; background: #F8EFD6; }
.pd-btn-primary { background: var(--accent); color: #fff; }
.pd-btn-primary:hover { filter: brightness(1.06); }

.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 300;
  background: var(--ink-1); color: var(--surface); padding: 13px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
  box-shadow: 0 14px 36px -12px rgba(0,0,0,.5); animation: toastin .25s cubic-bezier(.2,.7,.3,1); }
@keyframes toastin { from { transform: translate(-50%, 14px); opacity: 0; } }

/* TZ pills (US) */
.tzpills { display: none; gap: 4px; }
.tzpills.show { display: flex; }
.tzpill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--bg); color: var(--ink-2); }
.tzpill.is-active { background: var(--accent); color: #fff; }

/* ===== Responsive: phone ===== */
@media (max-width: 640px) {
  .appbar { padding: 11px 14px; }
  .appbar-title { font-size: 17px; }
  .appbar-icon { width: 36px; height: 36px; }
  .appbar-flag { font-size: 24px; }
  .clock { font-size: 19px; }
  .rs-main { padding: 22px 16px 40px; }
  .rs-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .rs-card { padding: 16px; gap: 12px; border-radius: 16px; }
  .rs-flagtile { width: 50px; height: 50px; font-size: 28px; border-radius: 13px; }
  .rs-name { font-size: 16px; }
  .epg-filters { padding: 10px 12px; gap: 10px; flex-wrap: wrap; }
  .searchbox { width: 100%; order: 2; }
  .chips { order: 1; width: 100%; }
  .epg { --rail-w: 128px !important; }
  .ch-logo { width: 32px; height: 32px; }
  .rail-name { font-size: 12.5px; }
  .pd-panel { width: 100%; max-width: 100%; }
}
</style>

  if(rid==='us'){ const s=US_SLUG[ch.id]; return s ? US_LOGO_BASE+s+'.png' : ''; }
  return '';
}
function logoText(ch){ const n=ch.n||''; return /[A-Za-z]/.test(n[0]||'') ? n.slice(0,4) : n.slice(0,2); }

// ── time helpers ──
function pad(n){ return String(n).padStart(2,'0'); }
function fmtMin(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }

// ── proxy (codetabs primary, allorigins fallback) ──
async function proxyGet(targetUrl){
  const enc=encodeURIComponent(targetUrl);
  try{ const r=await fetch(`https://api.codetabs.com/v1/proxy/?quest=${enc}`,{signal:AbortSignal.timeout(12000)});
    if(r.ok){ const t=await r.text(); if(t&&!t.includes('Just a moment')) return t; } }catch(e){}
  try{ const r=await fetch(`https://api.allorigins.win/get?url=${enc}`,{signal:AbortSignal.timeout(12000)});
    if(r.ok){ const j=await r.json(); if(j.contents&&!j.contents.includes('Just a moment')) return j.contents; } }catch(e){}
  throw new Error('proxy failed');
}

// ── US parser → [{start,end,name}] absolute grid minutes ──
function _dur(s){ let m=0; const h=s.match(/(\d+)h/); if(h)m+=+h[1]*60; const n=s.match(/(\d+)m/); if(n)m+=+n[1]; return m||60; }
function parseUSPrograms(html, tzOff){
  const out=[]; const parts=html.split(/(?=<div class="show-row")/);
  for(const part of parts){
    if(!part.includes('show-row')) continue;
    const ts=part.match(/data-ts="(\d+)"/); const du=part.match(/class="time-dur">([^<]+)</);
    const nm=part.match(/class="show-title-link[^"]*"[^>]*>\s*([^<]+?)\s*</);
    if(!ts||!nm) continue;
    const d=new Date((+ts[1])*1000 + tzOff*3600000);
    let start=d.getUTCHours()*60+d.getUTCMinutes(); if(d.getUTCHours()<5) start+=1440;
    out.push({ start, end:start+_dur(du?du[1]:'1h'), name:nm[1].trim() });
  }
  return out;
}
// ── TW parser → [{start,end,name}] absolute grid minutes ──
function parseTWPrograms(html){
  const today=new Date().toISOString().split('T')[0];
  const idx=html.indexOf(`"date":"${today}"`); if(idx<0) return [];
  const chunk=html.substring(idx); const pl=chunk.indexOf('"programList":['); if(pl<0) return [];
  let depth=0,start=-1,end=0;
  for(let i=pl;i<chunk.length;i++){ const c=chunk[i];
    if(c==='['){ if(start<0)start=i; depth++; } else if(c===']'){ depth--; if(depth===0){ end=i; break; } } }
  if(start<0||!end) return [];
  let arr; try{ arr=JSON.parse(chunk.substring(start,end+1)); }catch(e){ return []; }
  const toMin=t=>{ const p=t.split(':'); let m=(+p[0])*60+(+p[1]); if(+p[0]<5) m+=1440; return m; };
  return arr.filter(p=>p.timeS&&p.timeE&&p.program&&p.program!=='ads').map(p=>{
    let s=toMin(p.timeS), e=toMin(p.timeE); if(e<=s) e+=1440;
    return { start:s, end:e, name:p.program };
  });
}

// ===== App state =====
const ST = { region:null, cat:'all', query:'', usTzOff:-4, usTzLabel:'ET', progs:{}, nowTimer:null };
const USTV_CACHE={}, TWTVGO_CACHE={};
const root=document.getElementById('root');

function nowMinFor(rid){
  const r=REGIONS[rid];
  if(rid!=='us'){
    try{ const s=new Date().toLocaleString('en-US',{timeZone:r.tz,hour:'2-digit',minute:'2-digit',hour12:false});
      const [h,m]=s.split(':').map(Number); let mm=h*60+m; if(h<5)mm+=1440; return mm; }catch(e){}
  }
  const utc=Date.now()+new Date().getTimezoneOffset()*60000;
  const d=new Date(utc+ST.usTzOff*3600000); let mm=d.getHours()*60+d.getMinutes(); if(d.getHours()<5)mm+=1440; return mm;
}
function clockStr(){ const n=new Date(); return pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()); }
function dateStr(){ return new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'}); }

const SVG_BACK='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const SVG_TV='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="3"/><path d="M8 21h8M12 18v3"/></svg>';
const SVG_GO='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const SVG_SEARCH='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===== Region select =====
function renderRegions(){
  if(ST.nowTimer){ clearInterval(ST.nowTimer); ST.nowTimer=null; }
  ST.region=null;
  const total=REGION_LIST.reduce((a,r)=>a+r.count,0);
  root.innerHTML=`
  <div class="tvg-root"><div class="rs-root">
    <header class="appbar"><div class="appbar-left">
      <div class="appbar-icon">${SVG_TV}</div>
      <div><h1 class="appbar-title">電視節目表</h1><p class="appbar-sub">選擇地區查看節目</p></div>
    </div><div class="appbar-right"><div class="clock" id="clock">${clockStr()}</div><div class="datelabel">${dateStr()}</div></div></header>
    <main class="rs-main">
      <div class="rs-sectionhead"><span class="rs-eyebrow">選擇地區</span>
        <span class="rs-hint">${REGION_LIST.length} 個地區 · 共 ${total} 個頻道</span></div>
      <div class="rs-grid">${REGION_LIST.map(r=>`
        <button class="rs-card" data-rid="${r.key}">
          <span class="rs-flagtile">${r.flag}</span>
          <span class="rs-cardbody"><span class="rs-name">${r.name}</span>
            <span class="rs-count">${r.count} 個頻道</span></span>
          <span class="rs-go">${SVG_GO}</span>
        </button>`).join('')}</div>
    </main></div></div>`;
  root.querySelectorAll('.rs-card').forEach(b=>b.onclick=()=>openRegion(b.dataset.rid));
  startClock();
}
function startClock(){ if(ST._clk)clearInterval(ST._clk);
  ST._clk=setInterval(()=>{ const el=document.getElementById('clock'); if(el)el.textContent=clockStr(); },1000); }

// ===== EPG screen =====
function openRegion(rid){
  ST.region=rid; ST.cat='all'; ST.query=''; ST.progs={};
  const r=REGIONS[rid];
  const channels=CHANNELS[rid]||[];
  const realOnly=(rid==='us'||rid==='tw');
  const totalW=(GRID_END-GRID_START)*PX_MIN;

  // category counts (whole region)
  const counts={ all:channels.length };
  channels.forEach(ch=>{ const c=channelCategory(ch); counts[c]=(counts[c]||0)+1; });

  const ticks=[]; for(let m=GRID_START;m<=GRID_END;m+=30) ticks.push(m);

  root.innerHTML=`
  <div class="tvg-root"><div class="epg" style="--row-h:${ROW_H}px;--rail-w:${RAIL_W}px;--total-w:${totalW}px">
    <header class="appbar"><div class="appbar-left">
      <button class="backbtn" id="backBtn" aria-label="返回">${SVG_BACK}</button>
      <span class="appbar-flag">${r.flag}</span>
      <div><h1 class="appbar-title">${r.name}</h1>
        <p class="appbar-sub" id="epgSub">當地時間 ${fmtMin(nowMinFor(rid))}${rid==='us'?' ('+ST.usTzLabel+')':''} · ${channels.length} 個頻道</p></div>
      <div class="tzpills${rid==='us'?' show':''}" id="tzPills">
        ${[['ET',-4],['CT',-5],['MT',-6],['PT',-7]].map(([l,o])=>`<button class="tzpill${o===ST.usTzOff?' is-active':''}" data-off="${o}" data-lbl="${l}">${l}</button>`).join('')}
      </div>
    </div><div class="appbar-right"><div class="clock" id="clock">${clockStr()}</div><div class="datelabel">${dateStr()}</div></div></header>

    <div class="epg-filters">
      <div class="chips" id="chips">${CATEGORIES.filter(c=>c.key==='all'||counts[c.key]).map(c=>`
        <button class="chip${c.key==='all'?' is-active':''}" data-cat="${c.key}" style="--chip-accent:${c.color||'var(--accent)'}">
          ${c.color?'<span class="chip-dot"></span>':''}<span>${c.label}</span><span class="chip-count">${counts[c.key]||0}</span>
        </button>`).join('')}</div>
      <div class="searchbox">${SVG_SEARCH}
        <input id="search" placeholder="搜尋頻道名稱或頻道號" autocomplete="off">
        <button class="search-clear" id="searchClear" style="display:none">×</button></div>
    </div>

    <div class="epg-board" id="board"><div class="epg-inner">
      <div class="epg-axis"><div class="axis-corner"><span class="corner-label">頻道</span>
        <span class="corner-count" id="visCount">${channels.length}</span></div>
        <div class="axis-track">${ticks.map(m=>`<div class="tick ${m%60===0?'tick-hour':'tick-half'}" style="left:${(m-GRID_START)*PX_MIN}px"><span>${fmtMin(m)}</span></div>`).join('')}</div>
      </div>
      <div class="epg-rows" id="rows">${channels.map((ch,i)=>{
        const cat=channelCategory(ch); const col=CAT_MAP[cat].color;
        const logo=channelLogoUrl(ch,rid);
        const ico=logo?`<img src="${logo}" alt="" loading="lazy" onerror="this.parentElement.textContent='${esc(logoText(ch))}'">`:esc(logoText(ch));
        return `<div class="epg-row${realOnly?' hidden':''}" data-idx="${i}" data-cat="${cat}">
          <div class="epg-rail">
            <span class="ch-logo" style="background:${col}1f;color:${col}">${ico}</span>
            <div class="rail-text"><span class="rail-name">${esc(ch.n)}</span>
              <span class="rail-meta"><span class="rail-num">${esc(ch.num)}</span></span></div>
            <span class="rail-catbar" style="background:${col}"></span>
          </div>
          <div class="epg-track" data-track="${i}"></div>
        </div>`;
      }).join('')}<div class="epg-empty" id="emptyMsg" style="display:none">沒有符合的頻道</div></div>
      <div class="now-line" id="nowLine" style="display:none"><span class="now-bubble"></span></div>
    </div></div>
  </div></div>`;

  document.getElementById('backBtn').onclick=renderRegions;
  document.getElementById('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ ST.cat=b.dataset.cat;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('is-active',x===b)); applyFilter(); });
  const search=document.getElementById('search');
  search.oninput=()=>{ ST.query=search.value; document.getElementById('searchClear').style.display=search.value?'block':'none'; applyFilter(); };
  document.getElementById('searchClear').onclick=()=>{ search.value=''; ST.query=''; document.getElementById('searchClear').style.display='none'; applyFilter(); };
  document.getElementById('tzPills').querySelectorAll('.tzpill').forEach(b=>b.onclick=()=>{
    ST.usTzOff=+b.dataset.off; ST.usTzLabel=b.dataset.lbl; openRegion('us'); });

  startClock();
  positionNow();
  if(ST.nowTimer)clearInterval(ST.nowTimer);
  ST.nowTimer=setInterval(positionNow,1000);

  // fetch real data
  if(rid==='us') loadUS(channels);
  else if(rid==='tw') loadTW(channels);
  // other regions: channels shown with empty tracks (no real source)
  if(!realOnly){ root.querySelectorAll('.epg-row').forEach(r=>r.classList.remove('hidden')); }

  // scroll so now sits ~1/3 from left (left edge on phone)
  requestAnimationFrame(()=>{ const b=document.getElementById('board'); if(!b)return;
    const nx=(nowMinFor(rid)-GRID_START)*PX_MIN; const lead=window.innerWidth<=640?8:b.clientWidth*0.32;
    b.scrollLeft=Math.max(0,nx-lead); });
}

function positionNow(){
  if(!ST.region) return;
  const line=document.getElementById('nowLine'); if(!line) return;
  const nm=nowMinFor(ST.region);
  const sub=document.getElementById('epgSub');
  if(sub) sub.textContent=`當地時間 ${fmtMin(nm)}${ST.region==='us'?' ('+ST.usTzLabel+')':''} · ${(CHANNELS[ST.region]||[]).length} 個頻道`;
  const clk=document.getElementById('clock'); if(clk)clk.textContent=clockStr();
  if(nm<GRID_START||nm>GRID_END){ line.style.display='none'; return; }
  line.style.display='';
  line.style.left=`calc(var(--rail-w) + ${(nm-GRID_START)*PX_MIN}px)`;
  line.querySelector('.now-bubble').textContent=fmtMin(nm);
}

// render programs into a channel track (absolute positioned = true time alignment)
function fillTrack(idx, programs){
  const track=root.querySelector(`.epg-track[data-track="${idx}"]`); if(!track) return;
  const nm=nowMinFor(ST.region);
  track.innerHTML='';
  let painted=0;
  programs.forEach(p=>{
    if(p.end<=GRID_START||p.start>=GRID_END) return;
    const s=Math.max(p.start,GRID_START), e=Math.min(p.end,GRID_END);
    const left=(s-GRID_START)*PX_MIN, width=(e-s)*PX_MIN;
    const isNow=nm>=p.start&&nm<p.end, isPast=p.end<=nm, tight=width<64;
    const cell=document.createElement('button');
    cell.className='cell'+(isNow?' is-now':'')+(isPast?' is-past':'')+(tight?' is-tight':'');
    cell.style.cssText=`left:${left}px;width:${width-3}px;--cell-accent:var(--accent)`;
    cell.title=p.name;
    cell.innerHTML=`<span class="cell-main"><span class="cell-title"><span class="cell-titletext">${esc(p.name)}</span></span>
      <span class="cell-time">${fmtMin(p.start)}–${fmtMin(p.end)}</span></span>${isNow?'<span class="cell-nowtag">NOW</span>':''}`;
    cell.onclick=()=>openDetail(idx,p);
    track.appendChild(cell); painted++;
  });
  if(painted){ const row=root.querySelector(`.epg-row[data-idx="${idx}"]`); if(row){ row.dataset.has='1'; if(matchFilter(row)) row.classList.remove('hidden'); } }
}

function matchFilter(row){
  const i=+row.dataset.idx; const ch=CHANNELS[ST.region][i];
  const catOk=ST.cat==='all'||row.dataset.cat===ST.cat;
  const q=ST.query.trim().toLowerCase();
  const qOk=!q||(ch.n||'').toLowerCase().includes(q)||String(ch.num).includes(q);
  const realOnly=(ST.region==='us'||ST.region==='tw');
  const dataOk=!realOnly||row.dataset.has==='1';
  return catOk&&qOk&&dataOk;
}
function applyFilter(){
  let vis=0;
  root.querySelectorAll('.epg-row').forEach(row=>{ const ok=matchFilter(row); row.classList.toggle('hidden',!ok); if(ok)vis++; });
  const vc=document.getElementById('visCount'); if(vc)vc.textContent=vis;
  const em=document.getElementById('emptyMsg'); if(em)em.style.display=vis?'none':'';
}

// ===== loaders =====
async function loadUS(channels){
  const slugMap={}; channels.forEach((ch,i)=>{ const s=US_SLUG[ch.id]; if(!s)return; (slugMap[s]=slugMap[s]||[]).push(i); });
  const entries=Object.entries(slugMap); const sub=document.getElementById('epgSub'); let done=0;
  for(let i=0;i<entries.length;i+=4){
    await Promise.all(entries.slice(i,i+4).map(async([slug,idxs])=>{
      try{ let html=USTV_CACHE[slug]; if(!html){ html=await proxyGet(`https://us-tv-guide.com/tv-guide-${slug}/`); USTV_CACHE[slug]=html; }
        const progs=parseUSPrograms(html,ST.usTzOff); // re-parse so TZ switches re-align
        idxs.forEach(ix=>fillTrack(ix,progs)); done++;
      }catch(e){}
    }));
    await new Promise(r=>setTimeout(r,200));
  }
  applyFilter();
}
async function loadTW(channels){
  const idMap={}; Object.entries(TW_TVGO).forEach(([tvgo,twid])=>{ const ix=channels.findIndex(c=>c.id===twid); if(ix>=0)(idMap[tvgo]=idMap[tvgo]||[]).push(ix); });
  const entries=Object.entries(idMap); let done=0;
  for(let i=0;i<entries.length;i+=6){
    await Promise.all(entries.slice(i,i+6).map(async([tvgo,idxs])=>{
      try{ let progs=TWTVGO_CACHE[tvgo]; if(!progs){ const html=await proxyGet(`https://tvking.funorange.com.tw/channel/${tvgo}`); progs=parseTWPrograms(html); TWTVGO_CACHE[tvgo]=progs; }
        idxs.forEach(ix=>fillTrack(ix,progs)); done++;
      }catch(e){}
    }));
    await new Promise(r=>setTimeout(r,150));
  }
  applyFilter();
}

// ===== Detail drawer =====
function openDetail(idx,p){
  const ch=CHANNELS[ST.region][idx]; const cat=channelCategory(ch); const col=CAT_MAP[cat].color;
  const rid=ST.region; const logo=channelLogoUrl(ch,rid);
  const ico=logo?`<img src="${logo}" alt="" onerror="this.parentElement.textContent='${esc(logoText(ch))}'">`:esc(logoText(ch));
  const dur=p.end-p.start; const nm=nowMinFor(rid); const isNow=nm>=p.start&&nm<p.end;
  const scrim=document.createElement('div'); scrim.className='pd-scrim';
  scrim.innerHTML=`<aside class="pd-panel">
    <button class="pd-close" aria-label="關閉"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pd-hero" style="--pd-accent:${col}">
      <div class="pd-chanrow"><span class="pd-logo" style="background:${col}22;color:${col}">${ico}</span>
        <span class="pd-chanmeta"><span class="pd-channame">${esc(ch.n)}</span>
          <span class="pd-channum">頻道 ${esc(ch.num)} · ${CAT_MAP[cat].label}</span></span></div>
      <h2 class="pd-title">${esc(p.name)}</h2>
      <div class="pd-tags">${isNow?'<span class="pd-tag tag-live">● 現正播出</span>':''}<span class="pd-tag">${dur} 分鐘</span></div>
    </div>
    <div class="pd-body">
      <div class="pd-timecard">
        <div class="pd-timeblock"><span class="pd-timebig">${fmtMin(p.start)}</span><span class="pd-timelabel">開始</span></div>
        <div class="pd-timearrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>${dur} 分鐘</span></div>
        <div class="pd-timeblock"><span class="pd-timebig">${fmtMin(p.end)}</span><span class="pd-timelabel">結束</span></div>
      </div>
      <div class="pd-section"><h3>節目資訊</h3><p>${esc(ch.n)} · 頻道 ${esc(ch.num)}　|　${fmtMin(p.start)}–${fmtMin(p.end)}（${dur} 分鐘）。節目資料來自即時節目表。</p></div>
    </div>
  </aside>`;
  const close=()=>scrim.remove();
  scrim.onclick=e=>{ if(e.target===scrim) close(); };
  scrim.querySelector('.pd-close').onclick=close;
  scrim.querySelector('.pd-panel').onclick=e=>e.stopPropagation();
  document.body.appendChild(scrim);
}

renderRegions();
</script>
