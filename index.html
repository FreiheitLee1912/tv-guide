<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📺 電視節目表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f2f2f7;
  --sidebar:  #e8e8f0;
  --card:     #ffffff;
  --card2:    #f0f0f8;
  --border:   #d8d8e8;
  --accent:   #5248d4;
  --accent2:  rgba(82,72,212,.1);
  --text:     #1a1a2e;
  --muted:    #8080a8;
  --live:     #007a35;
  --now-clr:  #d92d20;
  --verified-bg:   rgba(0, 160, 60, .12);
  --verified-top:  #00a03c;
  --ch-w:     175px;
  --slot-w:   110px;
  --row-h:    66px;
  --hdr-h:    54px;
  --time-h:   34px;
}

html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif; }

/* ─── HEADER ──────────────────────────────────────────── */
#hdr {
  height:var(--hdr-h); display:flex; align-items:center; gap:10px;
  padding:0 16px; background:rgba(242,242,247,.96);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
  position:relative; z-index:30; flex-shrink:0;
}
#backBtn {
  display:none; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--border); background:var(--card);
  color:var(--text); font-size:20px; cursor:pointer; flex-shrink:0;
  transition:background .15s;
}
#backBtn:hover { background:var(--card2); }
#backBtn.show  { display:flex; }
.hdr-info {}
#hdrTitle { font-size:17px; font-weight:700; }
#hdrSub   { font-size:11px; color:var(--muted); margin-top:1px; }
.clock { margin-left:auto; text-align:right; }
.clock .hm   { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--text); }
.clock .date { font-size:11px; color:var(--muted); }

/* ─── APP SHELL ───────────────────────────────────────── */
#app { height:calc(100vh - var(--hdr-h)); display:flex; flex-direction:column; overflow:hidden; }

/* ─── HOME PAGE ───────────────────────────────────────── */
#pageHome { overflow-y:auto; padding:20px; display:none; }
#pageHome.active { display:block; }
.home-heading { font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.8px;
  text-transform:uppercase; margin-bottom:14px; }
.region-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
@media(min-width:520px){ .region-grid { grid-template-columns:repeat(4,1fr); } }
.region-card {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:26px 12px 18px; display:flex; flex-direction:column;
  align-items:center; gap:10px; cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  transition:transform .15s, border-color .15s, box-shadow .15s;
  user-select:none;
}
.region-card:hover  { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 4px 16px rgba(82,72,212,.15); }
.region-card:active { transform:scale(.97); }
.flag { font-size:48px; line-height:1; }
.region-name { font-size:14px; font-weight:600; color:var(--text); }
.region-cnt  { font-size:11px; color:var(--muted); }

/* ─── EPG PAGE ────────────────────────────────────────── */
#pageEPG { display:none; flex-direction:column; overflow:hidden; flex:1; }
#pageEPG.active { display:flex; }

/* Time + TZ header strip */
.time-hdr {
  height:var(--time-h); flex-shrink:0; display:flex; overflow:hidden;
  border-bottom:1px solid var(--border); background:var(--sidebar);
  position:relative; z-index:20;
}
.time-ch-gap {
  width:var(--ch-w); flex-shrink:0; border-right:1px solid var(--border);
  background:var(--sidebar); display:flex; align-items:center;
  padding:0 10px; gap:6px;
}

/* TZ pills */
.tz-pills { display:none; align-items:center; gap:3px; }
.tz-pills.show { display:flex; }
.tz-pill {
  font-size:10px; font-weight:600; padding:2px 7px;
  border-radius:12px; border:1px solid var(--border);
  background:transparent; color:var(--muted); cursor:pointer;
  transition:background .12s, color .12s;
  white-space:nowrap;
}
.tz-pill.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.tz-pill:hover:not(.active) { background:var(--card2); }

.time-slots-wrap { flex:1; overflow:hidden; }
.time-slots { display:flex; height:100%; width:max-content; }
.ts {
  flex-shrink:0; width:var(--slot-w); border-right:1px solid var(--border);
  display:flex; align-items:center; padding-left:8px;
  font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.ts.h0 { color:var(--text); font-weight:600; font-size:12px; }

/* EPG body */
.epg-body { flex:1; display:flex; overflow:hidden; }

/* Channel sidebar */
.ch-sidebar {
  width:var(--ch-w); flex-shrink:0; overflow-y:auto; overflow-x:hidden;
  border-right:1px solid var(--border); background:var(--sidebar);
  scrollbar-width:none;
}
.ch-sidebar::-webkit-scrollbar { display:none; }
.ch-cell {
  height:var(--row-h); display:flex; align-items:center;
  gap:8px; padding:0 10px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:background .12s; flex-shrink:0; position:relative;
}
.ch-cell:hover { background:var(--card2); }
.ch-cell.sel { background:var(--accent2); border-left:3px solid var(--accent); padding-left:7px; }
.ch-ico {
  font-size:20px; width:34px; height:34px; border-radius:8px;
  background:var(--card); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ch-txt { min-width:0; }
.ch-n  { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
.ch-np { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.ch-live-dot {
  width:6px; height:6px; border-radius:50%; background:var(--live);
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }

/* Programs scroll */
.prog-scroll { flex:1; overflow:auto; position:relative; }
.prog-grid   { position:relative; width:max-content; }

/* NOW line */
.now-line {
  position:absolute; top:0; bottom:0; width:2px;
  background:var(--now-clr); z-index:6; pointer-events:none;
}
.now-line::before {
  content:'NOW'; position:absolute; top:0; left:4px;
  background:var(--now-clr); color:#fff;
  font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; letter-spacing:.4px;
}

.prog-row { height:var(--row-h); display:flex; border-bottom:1px solid var(--border); }

/* Program block */
.pb {
  flex-shrink:0; height:100%; border-right:1px solid var(--border);
  padding:8px 10px; overflow:hidden; cursor:pointer;
  position:relative; background:var(--card); transition:background .1s; min-width:30px;
}
.pb:hover  { background:var(--card2); }
.pb.live   { background:rgba(82,72,212,.07); border-top:2px solid var(--accent); padding-top:6px; }
.pb.live:hover { background:rgba(82,72,212,.14); }
.pb.past   { opacity:.4; }
.pb.sel-prog { background:rgba(82,72,212,.18) !important; }

/* ✅ VERIFIED (from TVMaze real data) */
.pb.verified        { background:var(--verified-bg) !important; border-top:2px solid var(--verified-top); padding-top:6px; }
.pb.verified:hover  { background:rgba(0,160,60,.2) !important; }
.pb.verified.past   { opacity:.5; }
.pb.verified .pb-title { color:#006b28; font-weight:700; }
.pb.verified .pb-time  { color:#339955; }
.verified-badge {
  position:absolute; top:5px; right:6px;
  font-size:9px; font-weight:700; color:#006b28;
  background:rgba(0,160,60,.15); border:1px solid rgba(0,160,60,.3);
  border-radius:4px; padding:1px 5px; line-height:1.4;
}

.pb-title { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
.pb.live .pb-title { color:var(--accent); }
.pb-time  { font-size:10px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums; }
.pb-bar   { position:absolute; bottom:0; left:0; height:2px; background:var(--accent); }

/* Loading overlay on prog-row */
.loading-shimmer {
  animation: shimmer 1.4s infinite;
  background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%);
  background-size: 200% 100%;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ─── DETAIL PANEL ────────────────────────────────────── */
#detailPanel {
  flex-shrink:0; max-height:0; overflow:hidden;
  background:var(--card); border-top:1px solid var(--border);
  transition:max-height .28s ease; box-shadow:0 -2px 12px rgba(0,0,0,.08);
}
#detailPanel.open { max-height:210px; }
.dp-inner {
  padding:16px 20px 18px;
  display:grid; grid-template-columns:auto 1fr auto; gap:0 16px; align-items:start;
}
.dp-ico   { font-size:38px; padding-top:2px; }
.dp-ch    { font-size:11px; color:var(--muted); margin-bottom:4px; }
.dp-title { font-size:19px; font-weight:800; line-height:1.25; color:var(--text); }
.dp-meta  { font-size:12px; color:var(--muted); margin-top:5px; }
.dp-desc  { font-size:13px; color:#606080; margin-top:10px; line-height:1.65; }
.dp-tags  { display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
.tag {
  font-size:11px; padding:3px 10px; border-radius:20px;
  border:1px solid var(--border); color:var(--muted); background:var(--card2);
}
.tag.live-tag   { border-color:rgba(0,122,53,.4); color:var(--live); background:rgba(0,122,53,.08); }
.tag.real-tag   { border-color:rgba(0,160,60,.4); color:#006b28; background:rgba(0,160,60,.1); }
.dp-close {
  background:var(--card2); border:1px solid var(--border); color:var(--muted);
  width:28px; height:28px; border-radius:50%; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:color .15s;
  flex-shrink:0;
}
.dp-close:hover { color:var(--text); }

/* ─── SCROLLBAR ───────────────────────────────────────── */
.prog-scroll::-webkit-scrollbar { width:6px; height:6px; }
.prog-scroll::-webkit-scrollbar-track { background:var(--card2); }
.prog-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.prog-scroll::-webkit-scrollbar-thumb:hover { background:var(--muted); }
</style>
</head>

    </div>
    <div class="epg-body">
      <div class="ch-sidebar" id="chSidebar"></div>
      <div class="prog-scroll" id="progScroll">
        <div class="prog-grid" id="progGrid">
          <div class="now-line" id="nowLine"></div>

    </div>
    <div id="detailPanel">

        <button class="dp-close" onclick="closeDetail()">×</button>

</div>

const CH_TYPE_CACHE = {};
function pickType(chId, h) {
  if (!CH_TYPE_CACHE[chId]) {
    for (const [type, ids] of Object.entries(TYPE_MAP)) {
      if (ids.includes(chId)) { CH_TYPE_CACHE[chId] = type; break; }
    }
  }
  if (CH_TYPE_CACHE[chId]) return CH_TYPE_CACHE[chId];
  if (h>=6&&h<9)   return 'info';
  if (h>=9&&h<12)  return 'variety';
  if (h>=12&&h<14) return 'news';
  if (h>=14&&h<18) return 'drama';
  if (h>=18&&h<20) return 'news';
  if (h>=20&&h<23) return 'drama';
  return 'movie';
}

function buildSchedule(chId, regionId) {
  const pool = SHOWS[regionId] || SHOWS.tw;
  const seed = chId.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const slots=[]; let cur=0;
  const total=(GRID_E-GRID_S)*60;
  let idx=seed%100;
  while(cur<total){
    const h=GRID_S+Math.floor(cur/60);
    const type=pickType(chId,h);
    const durArr=DURS[type]||[60];
    const dur=durArr[(idx+Math.floor(cur/30))%durArr.length];
    const showPool=pool[type]||pool.news||['節目播出中'];
    const title=showPool[(idx+Math.floor(cur/60))%showPool.length];
    const desc=DESCS[type]||DESCS.news;
    slots.push({startMin:cur,dur,title,type,desc,real:false});
    cur+=dur; idx=(idx+7)%100;
  }
  return slots;
}

// ═══ LOCAL TIME ════════════════════════════════════════════
function localNow(rid){
  const r=REGIONS[rid];
  const off=(rid==='us')?usTzOff:r.off;
  try{
    // Use Intl for non-US; for US use our offset
    if(rid!=='us'){
      const s=new Date().toLocaleString('en-US',{timeZone:r.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      const[h,m]=s.split(':').map(Number);
      return{h,m,totalMin:h*60+m};
    }
  }catch{}
  const utc=new Date().getTime()+new Date().getTimezoneOffset()*60000;
  const loc=new Date(utc+off*3600000);
  return{h:loc.getHours(),m:loc.getMinutes(),totalMin:loc.getHours()*60+loc.getMinutes()};
}
function localTimeStr(rid){
  const {h,m}=localNow(rid);
  return`${pad(h)}:${pad(m)}`;
}

// ═══ EPG BUILD ════════════════════════════════════════════
function buildEPG(rid){
  const channels=CHANNELS[rid]||[];
  const {totalMin:nowMin}=localNow(rid);

  // Time header
  const slotsEl=document.getElementById('timeSlots');
  slotsEl.innerHTML='';
  for(let h=GRID_S;h<GRID_E;h++){
    for(let half=0;half<2;half++){
      const d=document.createElement('div');
      d.className='ts'+(half===0?' h0':'');
      d.style.width=SLOT_W+'px';
      d.textContent=half===0?`${pad(h%24)}:00`:`${pad(h%24)}:30`;
      slotsEl.appendChild(d);
    }
  }

  // Channel sidebar
  const sidebar=document.getElementById('chSidebar');
  sidebar.innerHTML='';
  channels.forEach((ch,i)=>{
    const sched=buildSchedule(ch.id,rid);
    const nowRelMin=nowMin-GRID_S*60;
    const cur=sched.find(s=>s.startMin<=nowRelMin&&s.startMin+s.dur>nowRelMin);
    const div=document.createElement('div');
    div.className='ch-cell'; div.dataset.idx=i;
    div.innerHTML=`<div class="ch-ico">${ch.ico}</div>
      <div class="ch-txt">
        <div class="ch-n">${ch.n}</div>
        <div class="ch-np">${cur?cur.title:'—'}</div>
      </div>
      <div class="ch-live-dot"></div>`;
    div.onclick=()=>selectChannel(i);
    sidebar.appendChild(div);
  });

  // Program grid
  const grid=document.getElementById('progGrid');
  Array.from(grid.querySelectorAll('.prog-row')).forEach(r=>r.remove());
  const totalW=(GRID_E-GRID_S)*2*SLOT_W;
  grid.style.width=totalW+'px';
  grid.style.minHeight=(channels.length*ROW_H)+'px';

  channels.forEach((ch,i)=>{
    const sched=buildSchedule(ch.id,rid);
    const row=document.createElement('div');
    row.className='prog-row'; row.dataset.chIdx=i;
    const nowRelMin=nowMin-GRID_S*60;

    sched.forEach((prog,pi)=>{
      if(prog.startMin>=(GRID_E-GRID_S)*60)return;
      const dur=Math.min(prog.dur,(GRID_E-GRID_S)*60-prog.startMin);
      const w=dur*MIN_PX;
      const isLive=prog.startMin<=nowRelMin&&prog.startMin+prog.dur>nowRelMin;
      const isPast=prog.startMin+prog.dur<=nowRelMin;

      const pb=document.createElement('div');
      pb.className='pb'+(isLive?' live':'')+(isPast?' past':'');
      pb.style.width=w+'px';
      pb.dataset.chIdx=i; pb.dataset.progIdx=pi;
      pb.dataset.start=prog.startMin; // for TVMaze matching

      const sh=pad((GRID_S+Math.floor(prog.startMin/60))%24), sm=pad(prog.startMin%60);
      const eMin=prog.startMin+prog.dur;
      const eh=pad((GRID_S+Math.floor(eMin/60))%24), em=pad(eMin%60);

      pb.innerHTML=`<div class="pb-title">${prog.title}</div><div class="pb-time">${sh}:${sm}–${eh}:${em}</div>`;

      if(isLive){
        const pct=Math.min(100,((nowRelMin-prog.startMin)/prog.dur)*100);
        const bar=document.createElement('div'); bar.className='pb-bar'; bar.style.width=pct+'%';
        pb.appendChild(bar);
      }

      pb.onclick=(e)=>{
        e.stopPropagation();
        selectChannel(i);
        showDetail(ch,prog,isLive,false);
        document.querySelectorAll('.pb.sel-prog').forEach(el=>el.classList.remove('sel-prog'));
        pb.classList.add('sel-prog');
      };
      row.appendChild(pb);
    });
    grid.appendChild(row);
  });

  // NOW line
  const nowX=(nowMin-GRID_S*60)*MIN_PX;
  document.getElementById('nowLine').style.left=Math.max(0,nowX)+'px';

  // Scroll sync
  const progScroll=document.getElementById('progScroll');
  const timeSlotsWrap=document.getElementById('timeSlotsWrap');
  const chSidebar=document.getElementById('chSidebar');
  progScroll.onscroll=()=>{
    timeSlotsWrap.querySelector('.time-slots').style.transform=`translateX(-${progScroll.scrollLeft}px)`;
    chSidebar.scrollTop=progScroll.scrollTop;
  };
  chSidebar.onscroll=()=>{ progScroll.scrollTop=chSidebar.scrollTop; };

  // Scroll to now
  requestAnimationFrame(()=>{
    const viewW=progScroll.clientWidth;
    progScroll.scrollLeft=Math.max(0,nowX-viewW/3);
  });

  // Fetch TVMaze for US
  if(rid==='us') fetchTVMaze();
}

// ═══ TVMAZE INTEGRATION ═══════════════════════════════════
async function fetchTVMaze(){
  try{
    const today=new Date().toISOString().split('T')[0];
    const res=await fetch(`https://api.tvmaze.com/schedule?country=US&date=${today}`);
    if(!res.ok)return;
    const data=await res.json();
    applyTVMazeData(data);
  }catch(e){
    console.warn('TVMaze fetch failed:',e);
  }
}

function applyTVMazeData(items){
  const channels=CHANNELS['us'];
  // Group items by channel
  const byChIdx={};

  items.forEach(item=>{
    const netName=item.show?.network?.name||item.show?.webChannel?.name||'';
    const chId=TVMAZE_MAP[netName];
    if(!chId)return;
    const chIdx=channels.findIndex(c=>c.id===chId);
    if(chIdx<0)return;

    // Parse airstamp to local US time using our selected offset
    let gridMin;
    try{
      const utcMs=new Date(item.airstamp).getTime();
      const localMs=utcMs+usTzOff*3600000;
      const d=new Date(localMs);
      const h=d.getUTCHours(), m=d.getUTCMinutes();
      gridMin=h*60+m-GRID_S*60;
    }catch{return;}

    if(gridMin<0||gridMin>=(GRID_E-GRID_S)*60)return;

    if(!byChIdx[chIdx]) byChIdx[chIdx]=[];
    byChIdx[chIdx].push({
      gridMin,
      dur:item.runtime||60,
      name:item.show?.name||item.name||'',
      epName:item.name||'',
      desc:item.show?.summary?.replace(/<[^>]+>/g,'')||DESCS.news,
      type:'news',
    });
  });

  // Patch DOM
  Object.entries(byChIdx).forEach(([chIdx,progs])=>{
    const row=document.querySelector(`.prog-row[data-ch-idx="${chIdx}"]`);
    if(!row)return;
    const pbs=Array.from(row.querySelectorAll('.pb'));

    progs.forEach(prog=>{
      // Find pb that overlaps this program's start
      let x=0;
      for(const pb of pbs){
        const pbStart=parseInt(pb.dataset.start||0);
        const pbW=parseFloat(pb.style.width||0);
        const pbDur=pbW/MIN_PX;
        const pbEnd=pbStart+pbDur;
        // Overlap check: prog starts within this block
        if(prog.gridMin>=pbStart&&prog.gridMin<pbEnd){
          const endMin=prog.gridMin+prog.dur;
          const sh=pad((GRID_S+Math.floor(prog.gridMin/60))%24), sm=pad(prog.gridMin%60);
          const eh=pad((GRID_S+Math.floor(endMin/60))%24),   em=pad(endMin%60);
          const showName=prog.name+(prog.epName&&prog.epName!==prog.name?` · ${prog.epName}`:'');

          pb.classList.add('verified');
          pb.querySelector('.pb-title').textContent=showName;
          pb.querySelector('.pb-time').textContent=`${sh}:${sm}–${eh}:${em}`;

          // Add verified badge if not already there
          if(!pb.querySelector('.verified-badge')){
            const badge=document.createElement('div');
            badge.className='verified-badge'; badge.textContent='✓ LIVE DATA';
            pb.appendChild(badge);
          }

          // Update detail panel if this is currently selected
          if(pb.classList.contains('sel-prog')){
            const chIdx2=parseInt(pb.dataset.chIdx);
            const ch=channels[chIdx2];
            if(ch) showDetailFromVerified(ch,prog);
          }

          // Update sidebar current program name
          const chCell=document.querySelector(`.ch-cell[data-idx="${chIdx}"]`);
          if(chCell){
            const nowRelMin=localNow('us').totalMin-GRID_S*60;
            if(prog.gridMin<=nowRelMin&&prog.gridMin+prog.dur>nowRelMin){
              const np=chCell.querySelector('.ch-np');
              if(np) np.textContent=prog.name;
            }
          }
          break;
        }
      }
    });
  });
}

function showDetailFromVerified(ch,prog){
  const r=REGIONS['us'];
  const endMin=prog.gridMin+prog.dur;
  const sh=pad((GRID_S+Math.floor(prog.gridMin/60))%24), sm=pad(prog.gridMin%60);
  const eh=pad((GRID_S+Math.floor(endMin/60))%24), em=pad(endMin%60);

  document.getElementById('dpIco').textContent=ch.ico;
  document.getElementById('dpCh').textContent=`${r.flag} ${r.name} · CH ${ch.num} · ${ch.n}`;
  document.getElementById('dpTitle').textContent=prog.name+(prog.epName&&prog.epName!==prog.name?`\n${prog.epName}`:'');
  document.getElementById('dpMeta').textContent=`🕐 ${sh}:${sm} – ${eh}:${em}  ·  ${prog.dur} 分鐘`;
  document.getElementById('dpDesc').textContent=prog.desc;
  const tagsEl=document.getElementById('dpTags');
  tagsEl.innerHTML='<span class="tag real-tag">✅ 真實節目資料</span><span class="tag live-tag">🔴 直播中</span>';
}

// ═══ SELECT CHANNEL ════════════════════════════════════════
function selectChannel(idx){
  selChIdx=idx;
  document.querySelectorAll('.ch-cell').forEach((el,i)=>el.classList.toggle('sel',i===idx));
  const cell=document.querySelector(`.ch-cell[data-idx="${idx}"]`);
  if(cell)cell.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// ═══ DETAIL PANEL ══════════════════════════════════════════
function showDetail(ch,prog,isLive,isVerified){
  const rid=curRegion, r=REGIONS[rid];
  const endMin=prog.startMin+prog.dur;
  const sh=pad((GRID_S+Math.floor(prog.startMin/60))%24), sm=pad(prog.startMin%60);
  const eh=pad((GRID_S+Math.floor(endMin/60))%24), em=pad(endMin%60);

  document.getElementById('dpIco').textContent=ch.ico;
  document.getElementById('dpCh').textContent=`${r.flag} ${r.name} · CH ${ch.num} · ${ch.n}`;
  document.getElementById('dpTitle').textContent=prog.title;
  document.getElementById('dpMeta').textContent=`🕐 ${sh}:${sm} – ${eh}:${em}  ·  ${prog.dur} 分鐘`;
  document.getElementById('dpDesc').textContent=prog.desc;
  const tagsEl=document.getElementById('dpTags');
  tagsEl.innerHTML='';
  if(isVerified)tagsEl.insertAdjacentHTML('beforeend','<span class="tag real-tag">✅ 真實節目資料</span>');
  if(isLive)tagsEl.insertAdjacentHTML('beforeend','<span class="tag live-tag">🔴 直播中</span>');
  tagsEl.insertAdjacentHTML('beforeend',`<span class="tag">${prog.type}</span><span class="tag">${prog.dur} min</span>`);
  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.pb.sel-prog').forEach(el=>el.classList.remove('sel-prog'));
}

document.getElementById('progScroll').addEventListener('click',e=>{
  if(e.target===document.getElementById('progScroll')||
     e.target===document.getElementById('progGrid'))closeDetail();
});

setInterval(()=>{
  if(curRegion){
    const tz=curRegion==='us'?` (${usTzLabel})`:'';
    document.getElementById('hdrSub').textContent=`當地時間 ${localTimeStr(curRegion)}${tz}`;
  }
},60000);
</script>
