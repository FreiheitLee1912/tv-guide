<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📺 電視節目表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0d0d12;
  --sidebar:  #111118;
  --card:     #17171f;
  --card2:    #1e1e28;
  --border:   #272733;
  --accent:   #6c63ff;
  --accent2:  rgba(108,99,255,.15);
  --text:     #eeeef8;
  --muted:    #6868a0;
  --live:     #00e676;
  --now-clr:  #ff4757;
  --ch-w:     170px;
  --slot-w:   110px;   /* px per 30 min */
  --row-h:    66px;
  --hdr-h:    54px;
  --time-h:   34px;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: -apple-system,'PingFang TC','Noto Sans TC',sans-serif; }

/* ═══ HEADER ═══════════════════════════════════════════ */
#hdr {
  height: var(--hdr-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  background: rgba(13,13,18,.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 30;
  flex-shrink: 0;
}
#backBtn {
  display: none; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 20px; cursor: pointer;
  flex-shrink: 0; transition: background .15s;
}
#backBtn:hover { background: var(--card2); }
#backBtn.show  { display: flex; }
.hdr-info {}
#hdrTitle { font-size: 17px; font-weight: 700; }
#hdrSub   { font-size: 11px; color: var(--muted); margin-top: 1px; }
.clock { margin-left: auto; text-align: right; }
.clock .hm   { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock .date { font-size: 11px; color: var(--muted); }

/* ═══ APP SHELL ═════════════════════════════════════════ */
#app { height: calc(100vh - var(--hdr-h)); display: flex; flex-direction: column; overflow: hidden; }

/* ═══ HOME PAGE ═════════════════════════════════════════ */
#pageHome { overflow-y: auto; padding: 20px; display: none; }
#pageHome.active { display: block; }

.home-heading { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 14px; }

.region-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; }
@media(min-width:520px) { .region-grid { grid-template-columns: repeat(4,1fr); } }

.region-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 26px 12px 18px; display: flex; flex-direction: column;
  align-items: center; gap: 10px; cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.region-card:hover  { transform: translateY(-3px); border-color: var(--accent); background: var(--card2); }
.region-card:active { transform: scale(.96); }
.flag        { font-size: 48px; line-height: 1; }
.region-name { font-size: 14px; font-weight: 600; }
.region-cnt  { font-size: 11px; color: var(--muted); }

/* ═══ EPG PAGE ══════════════════════════════════════════ */
#pageEPG { display: none; flex-direction: column; overflow: hidden; flex: 1; }
#pageEPG.active { display: flex; }

/* Time-header strip */
.time-hdr {
  height: var(--time-h); flex-shrink: 0;
  display: flex; overflow: hidden;
  border-bottom: 1px solid var(--border);
  background: var(--sidebar); position: relative; z-index: 20;
}
.time-ch-gap {
  width: var(--ch-w); flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--sidebar);
  display: flex; align-items: center; padding: 0 12px;
  font-size: 11px; color: var(--muted);
}
.time-slots-wrap { flex: 1; overflow: hidden; }
.time-slots {
  display: flex; height: 100%;
  width: max-content;
}
.ts {
  flex-shrink: 0; width: var(--slot-w);
  border-right: 1px solid var(--border);
  display: flex; align-items: center; padding-left: 8px;
  font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.ts.h0 { color: var(--text); font-weight: 600; font-size: 12px; }

/* EPG body */
.epg-body { flex: 1; display: flex; overflow: hidden; }

/* Channel sidebar */
.ch-sidebar {
  width: var(--ch-w); flex-shrink: 0;
  overflow-y: auto; overflow-x: hidden;
  border-right: 1px solid var(--border);
  background: var(--sidebar);
  scrollbar-width: none;
}
.ch-sidebar::-webkit-scrollbar { display: none; }

.ch-cell {
  height: var(--row-h); display: flex; align-items: center;
  gap: 8px; padding: 0 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;
  flex-shrink: 0; position: relative;
}
.ch-cell:hover { background: var(--card); }
.ch-cell.sel {
  background: var(--accent2);
  border-left: 3px solid var(--accent);
  padding-left: 7px;
}
.ch-ico {
  font-size: 20px; width: 34px; height: 34px; border-radius: 8px;
  background: var(--card2); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ch-txt { min-width: 0; }
.ch-n  { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-np { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ch-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--live);
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }

/* Programs scroll */
.prog-scroll { flex: 1; overflow: auto; position: relative; }

.prog-grid { position: relative; width: max-content; }

/* Red "NOW" line */
.now-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--now-clr); z-index: 6; pointer-events: none;
}
.now-line::before {
  content: 'NOW'; position: absolute; top: -1px; left: 4px;
  background: var(--now-clr); color: #fff;
  font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
  letter-spacing: .4px;
}

.prog-row {
  height: var(--row-h); display: flex;
  border-bottom: 1px solid var(--border);
}

.pb {
  flex-shrink: 0; height: 100%;
  border-right: 1px solid var(--border);
  padding: 8px 10px; overflow: hidden;
  cursor: pointer; position: relative;
  background: var(--card);
  transition: background .1s;
  min-width: 30px;
}
.pb:hover { background: var(--card2); }
.pb.live {
  background: rgba(108,99,255,.1);
  border-top: 2px solid var(--accent);
  padding-top: 6px;
}
.pb.live:hover { background: rgba(108,99,255,.2); }
.pb.past { opacity: .38; }
.pb.sel-prog { background: rgba(108,99,255,.25) !important; }

.pb-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb.live .pb-title { color: var(--accent); }
.pb-time  { font-size: 10px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

.pb-bar { position: absolute; bottom: 0; left: 0; height: 2px; background: var(--accent); }

/* ═══ DETAIL PANEL ══════════════════════════════════════ */
#detailPanel {
  flex-shrink: 0; max-height: 0; overflow: hidden;
  background: var(--card); border-top: 1px solid var(--border);
  transition: max-height .28s ease;
}
#detailPanel.open { max-height: 200px; }

.dp-inner {
  padding: 16px 20px 18px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0 16px;
  align-items: start;
}
.dp-ico  { font-size: 38px; padding-top: 2px; }
.dp-body {}
.dp-ch   { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.dp-title{ font-size: 19px; font-weight: 800; line-height: 1.25; }
.dp-meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
.dp-desc { font-size: 13px; color: #b0b0cc; margin-top: 10px; line-height: 1.65; }
.dp-tags { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border); color: var(--muted); background: var(--card2);
}
.tag.live-tag { border-color: rgba(0,230,118,.4); color: var(--live); background: rgba(0,230,118,.08); }
.dp-close {
  background: var(--card2); border: 1px solid var(--border);
  color: var(--muted); width: 28px; height: 28px; border-radius: 50%;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: color .15s;
}
.dp-close:hover { color: var(--text); }

/* ═══ SCROLLBAR ══════════════════════════════════════════ */
.prog-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.prog-scroll::-webkit-scrollbar-track { background: var(--bg); }
.prog-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.prog-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>

const DESCS = {
  news:  'Breaking news coverage and analysis of today\'s top stories from around the world. Live updates and expert commentary.',
  drama: 'Compelling drama series featuring powerful performances and gripping storylines that keep you on the edge of your seat.',
  comedy:'Laugh-out-loud entertainment with top comedians, celebrity guests, and the best sketches on television.',
  sports:'Live sports coverage and analysis. Scores, highlights, expert opinions and in-depth reporting.',
  reality:'Real people, real drama. Follow contestants and personalities as they compete, explore, and live life on screen.',
  sci:   'Explore the wonders of science and nature. Fascinating documentaries that reveal the world around us.',
  movie: 'Feature film presentation. Sit back and enjoy a full-length movie on your schedule.',
  variety:'Entertainment for all ages. Singing, dancing, games, and celebrity interviews in one show.',
  info:  'Health tips, lifestyle advice and useful information for your everyday life.',
};

// Durations per show type (minutes)
const DURS = {
  news:   [30,60,60,30,60],
  drama:  [60,60,60,90,60],
  comedy: [30,30,60,30],
  sports: [60,90,60,120],
  reality:[60,60,90,60],
  sci:    [60,60,90,60],
  movie:  [90,120,120,90],
  variety:[60,90,60],
  info:   [30,60,30],
};

function pickType(chId, regionId, h) {
  const isNews = chId.match(/0[0-4]$/) || ['cn03'].includes(chId) ||
    ['us02','us03','us04','us05','us06','us12','us36','us56','us59','us60'].includes(chId);
  if (isNews) return 'news';
  const isMovie= ['us07','us08','us09','us13','us53','us54','us52'].includes(chId);
  if (isMovie) return 'movie';
  const isSports=['us14','us18','us29','us34','us37','us38'].includes(chId);
  if (isSports) return 'sports';
  const isSci  =['us15','us16','us24','us47'].includes(chId);
  if (isSci) return 'sci';
  const isReality=['us20','us21','us28','us33','us43','us48','us49','us50'].includes(chId);
  if (isReality) return 'reality';
  const isComedy=['us39','us40','us46','us49'].includes(chId);
  if (isComedy) return 'comedy';
  // Time-based fallback
  if (h >= 6  && h < 9)  return 'info';
  if (h >= 9  && h < 12) return 'variety';
  if (h >= 12 && h < 14) return 'news';
  if (h >= 14 && h < 18) return 'drama';
  if (h >= 18 && h < 20) return 'news';
  if (h >= 20 && h < 23) return 'drama';
  return 'movie';
}

function buildSchedule(chId, regionId) {
  const pool = SHOWS[regionId] || SHOWS.tw;
  const seed  = chId.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const slots = [];
  let minFromGridStart = 0;
  const totalMins = (GRID_E - GRID_S) * 60;

  let idx = seed % 100;
  while (minFromGridStart < totalMins) {
    const startH = GRID_S + Math.floor(minFromGridStart / 60);
    const type   = pickType(chId, regionId, startH);
    const durArr = DURS[type] || [60];
    const dur    = durArr[(idx + Math.floor(minFromGridStart/30)) % durArr.length];
    const shows  = pool[type] || pool.news || ['節目進行中'];
    const title  = shows[(idx + Math.floor(minFromGridStart/60)) % shows.length];
    const desc   = DESCS[type] || DESCS.news;
    slots.push({ startMin: minFromGridStart, dur, title, type, desc });
    minFromGridStart += dur;
    idx = (idx + 7) % 100;
  }
  return slots;
}

// ═══ LOCAL TIME HELPERS ══════════════════════════════════
function localNow(regionId) {
  const r = REGIONS[regionId];
  try {
    const s = new Date().toLocaleString('en-US',{timeZone:r.tz,
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const [h,m,sec] = s.split(':').map(Number);
    return { h, m, totalMin: h*60+m };
  } catch {
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset()*60000;
    const loc = new Date(utc + r.off*3600000);
    return { h:loc.getHours(), m:loc.getMinutes(), totalMin:loc.getHours()*60+loc.getMinutes() };
  }
}

function localTimeStr(regionId) {
  const r = REGIONS[regionId];
  try {
    return new Date().toLocaleTimeString('zh-TW',{timeZone:r.tz,hour:'2-digit',minute:'2-digit',hour12:false});
  } catch { return '--:--'; }
}

// ═══ EPG BUILD ════════════════════════════════════════════
function buildEPG(rid) {
  const channels = CHANNELS[rid] || [];
  const { totalMin: nowMin } = localNow(rid);

  // Build time header
  const slotsEl = document.getElementById('timeSlots');
  slotsEl.innerHTML = '';
  for (let h = GRID_S; h < GRID_E; h++) {
    for (let half = 0; half < 2; half++) {
      const d = document.createElement('div');
      d.className = 'ts' + (half===0?' h0':'');
      d.style.width = SLOT_W + 'px';
      d.textContent = half===0 ? `${pad(h%24)}:00` : `${pad(h%24)}:30`;
      slotsEl.appendChild(d);
    }
  }

  // Build channel sidebar
  const sidebar = document.getElementById('chSidebar');
  sidebar.innerHTML = '';
  channels.forEach((ch,i) => {
    const sched = buildSchedule(ch.id, rid);
    const nowRelMin = nowMin - GRID_S*60;
    const cur = sched.find(s => s.startMin <= nowRelMin && s.startMin+s.dur > nowRelMin);
    const div = document.createElement('div');
    div.className = 'ch-cell';
    div.dataset.idx = i;
    div.innerHTML = `
      <div class="ch-ico">${ch.ico}</div>
      <div class="ch-txt">
        <div class="ch-n">${ch.n}</div>
        <div class="ch-np">${cur?cur.title:'—'}</div>
      </div>
      <div class="ch-live-dot"></div>`;
    div.onclick = () => selectChannel(i);
    sidebar.appendChild(div);
  });

  // Build program grid
  const grid = document.getElementById('progGrid');
  // Remove old rows (keep now-line)
  Array.from(grid.querySelectorAll('.prog-row')).forEach(r=>r.remove());

  const totalW = (GRID_E - GRID_S) * 2 * SLOT_W;
  grid.style.width  = totalW + 'px';
  grid.style.minHeight = (channels.length * ROW_H) + 'px';

  channels.forEach((ch,i) => {
    const sched = buildSchedule(ch.id, rid);
    const row = document.createElement('div');
    row.className = 'prog-row';
    row.dataset.chIdx = i;
    const nowRelMin = nowMin - GRID_S*60;

    sched.forEach((prog, pi) => {
      if (prog.startMin >= (GRID_E - GRID_S)*60) return;
      const dur = Math.min(prog.dur, (GRID_E-GRID_S)*60 - prog.startMin);
      const w = dur * MIN_PX;
      const isLive = prog.startMin <= nowRelMin && prog.startMin+prog.dur > nowRelMin;
      const isPast = prog.startMin + prog.dur <= nowRelMin;

      const pb = document.createElement('div');
      pb.className = 'pb' + (isLive?' live':'') + (isPast?' past':'');
      pb.style.width = w + 'px';
      pb.dataset.chIdx  = i;
      pb.dataset.progIdx= pi;

      let timeStr = `${pad((GRID_S + Math.floor(prog.startMin/60))%24)}:${pad(prog.startMin%60)}`;
      let endMin  = prog.startMin + prog.dur;
      let endStr  = `${pad((GRID_S + Math.floor(endMin/60))%24)}:${pad(endMin%60)}`;

      pb.innerHTML = `<div class="pb-title">${prog.title}</div><div class="pb-time">${timeStr}–${endStr}</div>`;

      if (isLive) {
        const elapsed = nowRelMin - prog.startMin;
        const pct = Math.min(100, (elapsed / prog.dur)*100);
        const bar = document.createElement('div');
        bar.className = 'pb-bar';
        bar.style.width = pct+'%';
        pb.appendChild(bar);
      }

      pb.onclick = (e) => {
        e.stopPropagation();
        selectChannel(i);
        showDetail(ch, prog, isLive);
        document.querySelectorAll('.pb.sel-prog').forEach(el=>el.classList.remove('sel-prog'));
        pb.classList.add('sel-prog');
      };
      row.appendChild(pb);
    });
    grid.appendChild(row);
  });

  // NOW line
  const nowLineEl = document.getElementById('nowLine');
  const nowX = (nowMin - GRID_S*60) * MIN_PX;
  nowLineEl.style.left = Math.max(0, nowX) + 'px';

  // Sync scrolling
  const progScroll = document.getElementById('progScroll');
  const timeSlotsWrap = document.getElementById('timeSlotsWrap');
  const chSidebar = document.getElementById('chSidebar');

  progScroll.onscroll = () => {
    timeSlotsWrap.querySelector('.time-slots').style.transform = `translateX(-${progScroll.scrollLeft}px)`;
    chSidebar.scrollTop = progScroll.scrollTop;
  };
  chSidebar.onscroll = () => {
    progScroll.scrollTop = chSidebar.scrollTop;
  };

  // Scroll to now (center in view)
  requestAnimationFrame(() => {
    const viewW = progScroll.clientWidth;
    progScroll.scrollLeft = Math.max(0, nowX - viewW/3);
  });
}

function selectChannel(idx) {
  selChIdx = idx;
  document.querySelectorAll('.ch-cell').forEach((el,i)=>{
    el.classList.toggle('sel', i===idx);
  });
  // Scroll sidebar to show selected
  const cell = document.querySelector(`.ch-cell[data-idx="${idx}"]`);
  if (cell) cell.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// ═══ DETAIL PANEL ════════════════════════════════════════
function showDetail(ch, prog, isLive) {
  const rid  = curRegion;
  const r    = REGIONS[rid];
  const startH  = (GRID_S + Math.floor(prog.startMin/60)) % 24;
  const startM  = prog.startMin % 60;
  const endMin  = prog.startMin + prog.dur;
  const endH    = (GRID_S + Math.floor(endMin/60)) % 24;
  const endM    = endMin % 60;
  const timeStr = `${pad(startH)}:${pad(startM)} – ${pad(endH)}:${pad(endM)}`;

  document.getElementById('dpIco').textContent   = ch.ico;
  document.getElementById('dpCh').textContent    = `${r.flag} ${r.name}  ·  CH ${ch.num}  ·  ${ch.n}`;
  document.getElementById('dpTitle').textContent = prog.title;
  document.getElementById('dpMeta').textContent  = `🕐 ${timeStr}  ·  ${prog.dur} 分鐘`;
  document.getElementById('dpDesc').textContent  = prog.desc;

  const tagsEl = document.getElementById('dpTags');
  tagsEl.innerHTML = '';
  if (isLive) tagsEl.insertAdjacentHTML('beforeend','<span class="tag live-tag">🔴 直播中</span>');
  tagsEl.insertAdjacentHTML('beforeend',`<span class="tag">${prog.type}</span>`);
  tagsEl.insertAdjacentHTML('beforeend',`<span class="tag">${prog.dur} min</span>`);

  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.pb.sel-prog').forEach(el=>el.classList.remove('sel-prog'));
}

// Close detail on grid background click
document.getElementById('progScroll').addEventListener('click', e => {
  if (e.target === document.getElementById('progScroll') ||
      e.target === document.getElementById('progGrid')) closeDetail();
});

// ═══ UPDATE EVERY MINUTE ════════════════════════════════
setInterval(() => {
  if (curRegion) {
    document.getElementById('hdrSub').textContent = `當地時間 ${localTimeStr(curRegion)}`;
  }
}, 60000);
